<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>myBook — Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <nav class="navbar container">

    <a class="brand" href="main.html">
      <span class="brand-mark">m</span>myBook
    </a>

    <div class="nav-links">
      <a href="main.html">Home</a>
      <a href="books.html">My Collection</a>
      <a href="login.html" class="guest-only">Login</a>
      <a href="register.html" class="guest-only">Register</a>
      <button
        id="logoutButton"
        class="logout-button user-only"
        type="button"
        >Logout</button>
    </div>

  </nav>
</header>


<main class="auth-page container">

  <section class="auth-card">

    <span class="eyebrow">Welcome back</span>

    <h1>Login to myBook</h1>

    <form id="loginForm">

      <label>
        Username or Email

        <input
          id="loginIdentifier"
          type="text"
          placeholder="Enter your username or email"
          required
        >
      </label>


      <label>
        Password

        <input
          id="loginPassword"
          type="password"
          required
        >
      </label>


      <button
        class="button primary full"
        type="submit"
      >
        Login
      </button>

    </form>


    <div
      id="authMessage"
      class="message"
      role="status"
    ></div>


    <p>
      Don't have an account?
      <a href="register.html">Register</a>
    </p>

  </section>

</main>


<script src="auth.js"></script>

</body>
</html>
